<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Comprar | Mirian de Oliveira | Imóveis & Patrimônio</title>

        <!-- Google Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

        <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">

        <!-- CSS principal -->
        <link rel="stylesheet" href="../css/style.css">
        <link rel="stylesheet" href="../css/comprar.css">

    </head>
        <body>

        <!-- ========================= HEADER ========================== -->
        <div id="site-header"></div>
        <!-- ========================= MENU MOBILE ========================== -->

        <main>

            <!-- ========================= INTRO ========================== -->
            <section class="page-intro">
                <div class="page-intro-content">
                    <p class="eyebrow">
                        IMÓVEIS À VENDA · PRAIA GRANDE
                    </p>

                    <h1>
                        Encontre um imóvel<br>
                        <em>para chamar de seu.</em>
                    </h1>

                    <p class="page-intro-description">
                        Explore imóveis disponíveis para compra e encontre
                        uma opção que combine com o seu momento, seus planos
                        e o seu jeito de viver.
                    </p>
                </div>
            </section>

            <!-- ========================= BUSCA ========================== -->
            <section class="property-search-page">
                <div class="search-box">
                    <div class="search-fields">
                        <div class="search-field">
                            <label for="filtroTipo">
                                Tipo de imóvel
                            </label>

                            <select id="filtroTipo">

                                <option value="">
                                    Todos
                                </option>

                            </select>
                        </div>

                        <div class="search-field">
                            <label for="filtroBairro">
                                Bairro
                            </label>

                            <select id="filtroBairro">
                                <option value="">
                                    Todos
                                </option>
                            </select>
                        </div>

                        <div class="search-field">
                            <label for="filtroQuartos">
                                Quartos
                            </label>

                            <select id="filtroQuartos">
                                <option value="">
                                    Todos
                                </option>

                                <option value="1">
                                    1 quarto
                                </option>

                                <option value="2">
                                    2 quartos
                                </option>

                                <option value="3">
                                    3 quartos
                                </option>

                                <option value="4">
                                    4 quartos
                                </option>

                                <option value="5">
                                    5+ quartos
                                </option>
                            </select>
                        </div>

                        <div class="search-field">
                            <label for="filtroVagas">
                                Vagas
                            </label>

                            <select id="filtroVagas">
                                <option value="">
                                    Todas
                                </option>

                                <option value="1">
                                    1+ vaga
                                </option>

                                <option value="2">
                                    2+ vagas
                                </option>

                                <option value="3">
                                    3+ vagas
                                </option>
                            </select>
                        </div>
                    </div>

                    <div class="search-actions">

                        <button type="button" class="search-button" id="buscarImoveis">
                            Encontrar imóveis
                        </button>

                        <button type="button" class="search-clear" id="limparBusca">
                            Limpar filtros
                        </button>
                    </div>
                </div>
            </section>

            <!-- ========================= RESULTADOS ========================== -->
            <section class="property-results">
                <div class="section-heading">
                    <div>
                        <p class="eyebrow">
                            DISPONÍVEIS PARA COMPRA
                        </p>

                        <h2 id="tituloResultados">
                            Imóveis à venda
                        </h2>
                    </div>
                </div>

                <div
                    class="property-grid" id="propertyGrid">
                </div>
            </section>
        </main>

    <!-- ========================= JAVASCRIPT ========================== -->
    <script src="../js/header.js"></script>
    <script src="../js/comprar.js"></script>

    </body>
</html>
